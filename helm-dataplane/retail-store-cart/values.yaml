# yaml-language-server: $schema=
# ---------------------------------------------------------
# Cart Application
# ---------------------------------------------------------
replicaCount: 3

image:
  repository: tcollins520/retail-store-cart
  pullPolicy: IfNotPresent
  tag: 1.3.0

carts:

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 100m
      memory: 356Mi

    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5

    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10

# ---------------------------------------------------------
# DynamoDB Database Endpoint
# ---------------------------------------------------------
database:
  RETAIL_CART_PERSISTENCE_PROVIDER: dynamodb
  RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME: Items
  RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: "true"
  RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: https://dynamodb.us-west-2.amazonaws.com
  AWS_REGION: us-west-2
  AWS_DEFAULT_REGION: us-west-2

# ---------------------------------------------------------
# Image Pull Secrets
# ---------------------------------------------------------
imagePullSecrets: []



# ---------------------------------------------------------
# Service Account
# ---------------------------------------------------------
serviceAccount:

  create: true
  name: carts


# ---------------------------------------------------------
# Autoscaling
# ---------------------------------------------------------
autoscaling:

  enabled: true

  minReplicas: 3

  maxReplicas: 12

  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80