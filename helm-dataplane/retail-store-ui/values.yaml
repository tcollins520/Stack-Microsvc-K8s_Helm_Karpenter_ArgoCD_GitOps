# yaml-language-server: $schema=
# ---------------------------------------------------------
# UI Application
# ---------------------------------------------------------
replicaCount: 3

image:
  repository: tcollins520/retail-store-ui
  pullPolicy: IfNotPresent
  tag: 2.0.0

ui:

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 100m
      memory: 356Mi

    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5

    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10

# ---------------------------------------------------------
# ConfigMap Values
# ---------------------------------------------------------
config:
  RETAIL_UI_ENDPOINTS_CATALOG: http://catalog
  RETAIL_UI_ENDPOINTS_CARTS: http://carts
  RETAIL_UI_ENDPOINTS_CHECKOUT: http://checkout
  RETAIL_UI_ENDPOINTS_ORDERS: http://orders


# ---------------------------------------------------------
# Image Pull Secrets
# ---------------------------------------------------------
imagePullSecrets: []



# ---------------------------------------------------------
# Service Account
# ---------------------------------------------------------
serviceAccount:

  create: true
  name: ui


# ---------------------------------------------------------
# Karpenter Autoscaling
# ---------------------------------------------------------
autoscaling:

  enabled: true

  minReplicas: 3

  maxReplicas: 12

  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80