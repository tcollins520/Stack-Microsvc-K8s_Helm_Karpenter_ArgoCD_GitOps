# ---------------------------------------------------------
# Orders Application
# ---------------------------------------------------------
replicaCount: 3

image:
  repository: tcollins520/retail-store-orders
  pullPolicy: IfNotPresent
  tag: 1.3.0

orders:

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 100m
      memory: 356Mi

    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5

    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10

# ---------------------------------------------------------
# PostgreSQL RDS Database Endpoint
# ---------------------------------------------------------
database:
  RETAIL_ORDERS_PERSISTENCE_PROVIDER: postgres
  RETAIL_ORDERS_PERSISTENCE_ENDPOINT: orders-postgres-db.cml0yuu2ka2y.us-east-1.rds.amazonaws.com:5432
  RETAIL_ORDERS_PERSISTENCE_NAME: ordersdb
  RETAIL_ORDERS_MESSAGING_PROVIDER: sqs
  RETAIL_ORDERS_MESSAGING_SQS_TOPIC: retail-dev-orders-queue
  #RETAIL_ORDERS_MESSAGING_SQS_TOPIC: https://sqs.us-east-1.amazonaws.com/180789647333/retail-dev-orders-queue

# ---------------------------------------------------------
# Image Pull Secrets
# ---------------------------------------------------------
imagePullSecrets: []


# ---------------------------------------------------------
# Secrets for AWS RDS Database Credentials
# ---------------------------------------------------------
secrets:
  awsRegion: us-east-1
  secretName: retailstore-db-secret-1
  secretProviderClass: orders-db-secrets



# ---------------------------------------------------------
# Service Account
# ---------------------------------------------------------
serviceAccount:

  create: true
  name: orders


# ---------------------------------------------------------
# Autoscaling
# ---------------------------------------------------------
autoscaling:

  enabled: true

  minReplicas: 3

  maxReplicas: 12

  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80