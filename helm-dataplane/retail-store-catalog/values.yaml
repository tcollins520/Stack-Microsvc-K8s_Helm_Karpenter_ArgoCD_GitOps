# ---------------------------------------------------------
# Catalog Application
# ---------------------------------------------------------
replicaCount: 3

image:
  repository: tcollins520/retail-store-catalog
  pullPolicy: IfNotPresent
  tag: 1.3.0

catalog:

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 100m
      memory: 356Mi

    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10

# ---------------------------------------------------------
# MySQL RDS Database Endpoint
# ---------------------------------------------------------
database:
  endpoint: mydb3.cml0yuu2ka2y.us-east-1.rds.amazonaws.com
  port: 3306
  serviceName: catalog-mysql

# ---------------------------------------------------------
# Image Pull Secrets
# ---------------------------------------------------------
imagePullSecrets: []


# ---------------------------------------------------------
# Secrets for AWS RDS Database Credentials
# ---------------------------------------------------------
secrets:
  awsRegion: us-east-1
  secretName: retailstore-db-secret-1
  secretProviderClass: catalog-db-secrets



# ---------------------------------------------------------
# Service Account
# ---------------------------------------------------------
serviceAccount:

  create: true

  name: catalog


# ---------------------------------------------------------
# Autoscaling
# ---------------------------------------------------------
autoscaling:

  enabled: true

  minReplicas: 3

  maxReplicas: 12

  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80