# yaml-language-server: $schema=false
# =========================================================
# Retail Store - Cart Service values.yaml
# =========================================================

# ---------------------------------------------------------
# Cart Application
# ---------------------------------------------------------
image:
  repository: tcollins520/retail-store-cart
  pullPolicy: IfNotPresent
  tag: "1.3.0"

cart:
  replicas: 2

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  probes:
    readiness:
      path: /actuator/health
      initialDelaySeconds: 10
      periodSeconds: 5
    liveness:
      path: /actuator/health
      initialDelaySeconds: 30
      periodSeconds: 10


# ---------------------------------------------------------
# DynamoDB
# ---------------------------------------------------------
dynamodb:

  replicas: 1
  
  image:
    repository: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local
    tag: "1.25.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  persistence:
    enabled: true
    storageClass: gp2
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


# ---------------------------------------------------------
# ConfigMap Values
# ---------------------------------------------------------
config:
  RETAIL_CART_PERSISTENCE_PROVIDER: dynamodb
  RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME: Items
  RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: "true"
  AWS_ACCESS_KEY_ID: key
  AWS_SECRET_ACCESS_KEY: secret
  RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: http://carts-dynamodb:8000

# ---------------------------------------------------------
# Ingress
# ---------------------------------------------------------
ingress:

  enabled: true

  className: nginx

  host: cart.tcapp.xyz

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

  tls:
    enabled: false


# ---------------------------------------------------------
# Service Account
# ---------------------------------------------------------
serviceAccount:

  create: true

  name: carts

# ---------------------------------------------------------
# Init Containers
# ---------------------------------------------------------
initContainers:

  enabled: true

  image: busybox:1.36

