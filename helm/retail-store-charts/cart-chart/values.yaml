# =========================================================
# Retail Store - Cart Service values.yaml
# =========================================================

# ---------------------------------------------------------
# Cart Application
# ---------------------------------------------------------
image:
  repository: tcollins520/retail-store-cart
  pullPolicy: IfNotPresent
  tag: 1.3.0

catalog:

  replicas: 2

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

    limits:
      cpu: 200m
      memory: 256Mi

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10


# ---------------------------------------------------------
# MySQL Database
# ---------------------------------------------------------
mysql:

  image: public.ecr.aws/docker/library/mysql

  tag: "8.0"

  replicas: 1

  containerPort: 3306

  service:
    type: ClusterIP
    port: 3306

  database: catalog

  persistence:
    enabled: true
    storageClass: gp2
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: 500m
      memory: 512Mi


# ---------------------------------------------------------
# Secrets
# ---------------------------------------------------------
secrets:

  mysql:

    rootPassword: my-secret-pw

    username: cataloguser

    password: catalogpass


# ---------------------------------------------------------
# ConfigMap Values
# ---------------------------------------------------------
config:

  SPRING_DATASOURCE_URL: jdbc:mysql://catalog-mysql:3306/catalog

  SPRING_DATASOURCE_USERNAME: cataloguser

  MYSQL_HOST: catalog-mysql

  MYSQL_PORT: "3306"

  MYSQL_DATABASE: catalog


# ---------------------------------------------------------
# Ingress
# ---------------------------------------------------------
ingress:

  enabled: true

  className: nginx

  host: catalog.tcapp.xyz

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

  tls:
    enabled: false


# ---------------------------------------------------------
# Image Pull Secrets
# ---------------------------------------------------------
imagePullSecrets: []


# ---------------------------------------------------------
# Service Account
# ---------------------------------------------------------
serviceAccount:

  create: true

  name: catalog


# ---------------------------------------------------------
# Autoscaling
# ---------------------------------------------------------
autoscaling:

  enabled: false

  minReplicas: 2

  maxReplicas: 5

  targetCPUUtilizationPercentage: 70


# ---------------------------------------------------------
# Init Containers
# ---------------------------------------------------------
initContainers:

  enabled: true

  image: busybox:1.36


# ---------------------------------------------------------
# Global Service Values
# ---------------------------------------------------------
service:
  type: ClusterIP
  port: 80