# yaml-language-server: $schema=false
# =========================================================
# Retail Store - Checkout Service values.yaml
# =========================================================

# ---------------------------------------------------------
# Checkout Application
# ---------------------------------------------------------
image:
  repository: tcollins520/retail-store-checkout
  pullPolicy: IfNotPresent
  tag: "1.3.0"

checkout:
  replicas: 2

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10


# ---------------------------------------------------------
# Redis Cache
# ---------------------------------------------------------
redis:

  replicas: 1
  
  image:
    repository: redis
    tag: "6.0-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  persistence:
    enabled: true
    storageClass: gp2
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


# ---------------------------------------------------------
# ConfigMap Values
# ---------------------------------------------------------
config:
  RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: redis
  RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: redis://checkout-redis:6379
  RETAIL_CHECKOUT_ENDPOINTS_ORDERS: http://orders:80

# ---------------------------------------------------------
# Ingress
# ---------------------------------------------------------
ingress:

  enabled: true

  className: nginx

  host: checkout.tcapp.xyz

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

  tls:
    enabled: false


# ---------------------------------------------------------
# Service Account
# ---------------------------------------------------------
serviceAccount:

  create: true

  name: checkout

# ---------------------------------------------------------
# Init Containers
# ---------------------------------------------------------
initContainers:

  enabled: true

  image: busybox:1.36

