# Source: retail-store-carts/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: carts-retail-store-carts
data:
  RETAIL_CART_PERSISTENCE_PROVIDER: "dynamodb"
  RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME: "Items"
  RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: "false"
  RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: "https://dynamodb.us-west-2.amazonaws.com"
  AWS_REGION: "us-west-2"
  AWS_DEFAULT_REGION: "us-west-2"
