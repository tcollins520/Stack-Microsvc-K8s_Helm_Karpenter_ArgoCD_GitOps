# yaml-language-server: $schema=
# ---------------------------------------------------------
# Checkout Application
# ---------------------------------------------------------
replicaCount: 3

image:
  repository: tcollins520/retail-store-checkout
  pullPolicy: IfNotPresent
  tag: 1.3.0

checkout:

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 100m
      memory: 356Mi

    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10

# ---------------------------------------------------------
# Redis Database Endpoint
# ---------------------------------------------------------
database:
  RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: redis
  RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: "redis://retail-dev-checkout-redis.rcapw5.0001.use1.cache.amazonaws.com:6379"
  RETAIL_CHECKOUT_ENDPOINTS_ORDERS: http://orders:80

# ---------------------------------------------------------
# Image Pull Secrets
# ---------------------------------------------------------
imagePullSecrets: []



# ---------------------------------------------------------
# Service Account
# ---------------------------------------------------------
serviceAccount:

  create: true
  name: checkout


# ---------------------------------------------------------
# Karpenter Autoscaling
# ---------------------------------------------------------
autoscaling:

  enabled: true

  minReplicas: 3

  maxReplicas: 12

  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80