apiVersion: v1
kind: Pod
metadata:
  name: catalog-sqs-client
  namespace: default
spec:
  serviceAccountName: catalog
  containers:
  - name: aws-cli
    image: amazon/aws-cli
    command: ["/bin/sh"]
    args: ["-c", "sleep infinity"]

    env:
      - name: AWS_REGION
        value: us-east-1

      # Fetch queue name from ConfigMap
      - name: SQS_QUEUE_NAME
        valueFrom:
          configMapKeyRef:
            name: catalog
            key: RETAIL_catalog_MESSAGING_SQS_TOPIC
  restartPolicy: Never
