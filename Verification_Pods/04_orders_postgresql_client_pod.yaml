apiVersion: v1
kind: Pod
metadata:
  name: catalog-postgresql-client
  namespace: default
spec:
  # Use the same ServiceAccount that has Pod Identity access
  serviceAccountName: catalog
  containers:
  - name: psql-client
    image: postgres:17.6
    command: ["/bin/sh"]
    args: ["-c", "sleep infinity"]

    env:
      # ✅ Fetch credentials securely from synced Secret
      - name: PGUSER
        valueFrom:
          secretKeyRef:
            name: catalog-db
            key: RETAIL_catalog_PERSISTENCE_USERNAME

      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: catalog-db
            key: RETAIL_catalog_PERSISTENCE_PASSWORD

      # Fetch DB endpoint and name from ConfigMap
      - name: PGHOST
        valueFrom:
          configMapKeyRef:
            name: catalog
            key: RETAIL_catalog_PERSISTENCE_ENDPOINT

      - name: PGDATABASE
        valueFrom:
          configMapKeyRef:
            name: catalog
            key: RETAIL_catalog_PERSISTENCE_NAME

  restartPolicy: Never
