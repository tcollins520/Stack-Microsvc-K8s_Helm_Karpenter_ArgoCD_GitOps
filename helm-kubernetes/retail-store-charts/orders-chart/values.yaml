# yaml-language-server: $schema=false
# =========================================================
# Retail Store - Orders Service values.yaml
# =========================================================

# ---------------------------------------------------------
# Orders Application
# ---------------------------------------------------------
image:
  repository: tcollins520/retail-store-orders
  pullPolicy: IfNotPresent
  tag: 1.3.0

orders:

  replicas: 2

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

    limits:
      cpu: 200m
      memory: 256Mi

  probes:
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5

    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10


# ---------------------------------------------------------
# PostgreSQL Database
# ---------------------------------------------------------
postgresql:

  image: 
    repository: public.ecr.aws/docker/library/postgres
    tag: "16.1"
    pullPolicy: IfNotPresent

  replicas: 1

  containerPort: 5432

  service:
    type: ClusterIP
    port: 5432

  database: orders

  persistence:
    enabled: true
    storageClass: gp2
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------
# RabbitMQ Database
# ---------------------------------------------------------
rabbitmq:

  image: 
    repository: public.ecr.aws/docker/library/rabbitmq
    tag: "3.12"
    pullPolicy: IfNotPresent

  replicas: 1

  containerPort: 5672

  service:
    type: ClusterIP
    port: 5672

  database: orders

  persistence:
    enabled: true
    storageClass: gp2
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: 500m
      memory: 512Mi


# ---------------------------------------------------------
# Secrets
# ---------------------------------------------------------
secrets:

  postgresql:

    rootPassword: my-secret-pw

    username: ordersuser

    password: orderspass


# ---------------------------------------------------------
# ConfigMap Values
# ---------------------------------------------------------
config:
  RETAIL_ORDERS_MESSAGING_PROVIDER: rabbitmq
  RETAIL_ORDERS_MESSAGING_RABBITMQ_ADDRESSES: orders-rabbitmq:5672
  RETAIL_ORDERS_PERSISTENCE_PROVIDER: postgres
  RETAIL_ORDERS_PERSISTENCE_ENDPOINT: orders-postgresql:5432
  RETAIL_ORDERS_PERSISTENCE_NAME: orders


# ---------------------------------------------------------
# Ingress
# ---------------------------------------------------------
ingress:

  enabled: true

  className: nginx

  host: orders.tcapp.xyz

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

  tls:
    enabled: false


# ---------------------------------------------------------
# Image Pull Secrets
# ---------------------------------------------------------
imagePullSecrets: []


# ---------------------------------------------------------
# Service Account
# ---------------------------------------------------------
serviceAccount:

  create: true

  name: orders


# ---------------------------------------------------------
# Autoscaling
# ---------------------------------------------------------
autoscaling:

  enabled: false

  minReplicas: 2

  maxReplicas: 5

  targetCPUUtilizationPercentage: 70


# ---------------------------------------------------------
# Init Containers
# ---------------------------------------------------------
initContainers:

  enabled: true

  image: busybox:1.36


# ---------------------------------------------------------
# Global Service Values
# ---------------------------------------------------------
service:
  type: ClusterIP
  port: 80